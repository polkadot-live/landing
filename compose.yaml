# Docker Compose Configuration

services:
  # Development Service
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: polkadot-live-landing-dev
    ports:
      - 5173:5173
    environment:
      NODE_ENV: development
    volumes:
      - './src:/usr/src/app/src:ro'
      - './package.json:/usr/src/app/package.json:ro'
      - './public:/usr/src/app/public:ro'
      - './tailwind.config.ts:/usr/src/app/tailwind.config.ts:ro'
      - './tsconfig.app.json:/usr/src/app/tsconfig.app.json:ro'
      - './tsconfig.json:/usr/src/app/tsconfig.json:ro'
      - './tsconfig.node.json:/usr/src/app/tsconfig.node.json:ro'
      - './vite.config.ts:/usr/src/app/vite.config.ts:ro'
    develop:
      watch:
        - action: rebuild
          path: ./package.json
          target: /usr/src/app/package.json
        - action: sync
          path: ./src
          target: /usr/src/app/src
    restart: unless-stopped
    networks:
      - pl-network
    profiles:
      - dev

  # Production Service
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: polkadot-live-landing-prod
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - pl-network
    profiles:
      - prod

networks:
  pl-network:
    driver: bridge
